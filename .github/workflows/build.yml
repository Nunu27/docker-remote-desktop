name: Build and Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker Desktop
        id: meta-desktop
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=ubuntu-noble
            type=raw,value=ubuntu-24.04

      - name: Build and push Docker Desktop image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-desktop.outputs.tags }}
          labels: ${{ steps.meta-desktop.outputs.labels }}
          build-args: |
            TAG=noble

      - name: Extract metadata (tags, labels) for Docker SSH
        id: meta-ssh
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ssh-latest
            type=schedule,pattern=ssh-{{date 'YYYYMMDD'}}
            type=raw,value=ssh-ubuntu-noble
            type=raw,value=ssh-ubuntu-24.04

      - name: Build and push Docker SSH image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ssh
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-ssh.outputs.tags }}
          labels: ${{ steps.meta-ssh.outputs.labels }}
